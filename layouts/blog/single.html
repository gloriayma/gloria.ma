{{ define "main" }}
<main class="page">
  <h1>{{ .Title }}</h1>
  <hr class="title-rule">
  {{ if .Params.showdate }}
  <p class="post-date"><time datetime="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date.Format "January 2, 2006 · 3:04 PM" }}</time></p>
  {{ end }}
  {{ .Content }}
</main>
{{ end }}
